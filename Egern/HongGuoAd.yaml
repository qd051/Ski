name: 红果短剧去广告
description: 拦截红果短剧广告域名、广告接口，降低广告加载，不保证全部广告清除
author: Custom
icon: shield.checkmark
# Egern Module YAML 格式
rules:
  - DOMAIN-WILDCARD,*-misc-lq.fqnovel.com,REJECT
  - DOMAIN-WILDCARD,*-reading-ad.qznovelvod.com,REJECT
  - DOMAIN-WILDCARD,*-iosreadingvideo.qznovelvod.com,REJECT
  - DOMAIN-WILDCARD,ads*-normal-l*.zijieapi.com,REJECT
  - DOMAIN-SUFFIX,v11-reading-video.qznovelvod.com,REJECT
  - DOMAIN-SUFFIX,ad-sign.byteimg.com,REJECT
  - DOMAIN-SUFFIX,ad.toutiao.com,REJECT
  - DOMAIN-SUFFIX,ad.bytedance.com,REJECT
  - DOMAIN-SUFFIX,ttadp.org,REJECT
  - DOMAIN-SUFFIX,pangle.io,REJECT
rewrite:
  # 拦截广告配置接口，返回空广告json
  - match: ^https://.*\.fqnovel\.com/.*ad.*
    type: body
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{"ad_list":[],"code":0}'
  - match: ^https://.*\.qznovelvod\.com/.*ad.*
    type: body
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{"ads":[]}'
mitm:
  - name: "红果短剧 MITM"
    match:
      - "*.fqnovel.com"
      - "*.qznovelvod.com"
      - "*.zijieapi.com"
